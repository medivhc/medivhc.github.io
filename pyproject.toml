[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvd-harness"
version = "0.1.0"
description = "RVD 2.0 Core: goal contracts, evidence-gated completion, persistent recovery"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4.18"]
license = {text = "MIT"}

[project.scripts]
rvd = "rvd_core.cli:main"

[tool.setuptools]
packages = ["rvd_core"]
